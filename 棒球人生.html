<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>棒球人生</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d2a1f;--card:#fff;--ac:#2f7d4f;--mut:#6b7a6e;--bd:#d9d4c7;--fd:#7fb069;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--fg:#e6efe8;--card:#1c2a20;--ac:#58b97c;--mut:#93a597;--bd:#2f4235;--fd:#2f5a3a}}
:root[data-theme="dark"]{--bg:#121a14;--fg:#e6efe8;--card:#1c2a20;--ac:#58b97c;--mut:#93a597;--bd:#2f4235;--fd:#2f5a3a}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
#m{max-width:520px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;line-height:1.6}
small{color:var(--mut)}h2{margin:4px 0 8px}
button,input{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:10px 12px;background:var(--card);color:var(--fg)}
button{display:block;width:100%;margin:6px 0;text-align:left;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;font-size:13px}
.g i{display:block;height:5px;background:var(--bd);border-radius:3px;margin-top:2px}.g u{display:block;height:5px;background:var(--ac);border-radius:3px}
#fd{position:relative;height:300px;border-radius:10px;background:var(--fd);overflow:hidden;touch-action:manipulation;user-select:none}
#zn{position:absolute;left:35%;width:30%;top:74%;height:18%;border:2px dashed #fff8}
#bl{position:absolute;display:none;background:#fff;border:1px solid #888;border-radius:50%;transform:translate(-50%,0);top:0;width:10px;height:10px}
#bx{position:relative;width:240px;height:240px;margin:0 auto;background:var(--fd);border-radius:10px;touch-action:manipulation;user-select:none}
#sz{position:absolute;left:16.25%;top:16.25%;width:67.5%;height:67.5%;border:2px dashed #fff9}
#cu{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #c0392b;transform:translate(-50%,-50%)}
#msg{text-align:center;min-height:48px;margin-top:8px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g2 button{margin:0}.sel{border:2px solid var(--ac)!important}#bx{width:100%!important;height:auto!important;aspect-ratio:480/340;margin:0!important;overflow:hidden;cursor:crosshair}#sz{left:43.75%!important;top:45.9%!important;width:12.5%!important;height:19.1%!important}#fd{height:auto!important;aspect-ratio:480/340;background:none!important}#ua{opacity:0}.kc #ua{opacity:1}#cv{image-rendering:pixelated}#tg,#ac{position:absolute;display:none;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}#tg{background:#fff;border:2px solid #333}#ac{background:#e74c3c}</style></head><body><div id="m"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(v))),c2=(v,a,b)=>Math.max(a,Math.min(b,v)),rn=Math.random;
let S,acts=[];const A=f=>{acts.push(f);return `onclick="acts[${acts.length-1}]()"`};
const show=h=>{$('#m').innerHTML=h;scrollTo(0,0)};
const PN={ff:'四縫線速球',ft:'二縫線速球',sk:'伸卡球',ct:'卡特球',sp:'指叉球',fs:'快速指叉球',cv:'曲球',sl:'滑球',sw:'橫掃球',ch:'變速球'};
const N={...PN,pow:'打擊力量',con:'擊球能力',spd:'速度',fld:'守備',sta:'體能',ctl:'控球'};
const PP={ff:[125,.35,0,0],ft:[123,.33,.4,.15],sk:[119,.3,.5,.5],ct:[118,.3,-.4,.2],sp:[112,.28,0,.9],fs:[118,.3,0,.6],cv:[98,.25,0,1],sl:[111,.28,-.7,.3],sw:[104,.25,-1,.1],ch:[106,.3,.4,.5]};
const vel=(k,t)=>Math.round(PP[k][0]+PP[k][1]*t);
const cost=v=>v<50?1:v<70?2:v<85?3:4;
const LV=['二軍','一軍後援','一軍先發','聯盟明星'];
function ovr(){if(S.role=='B')return(S.pow*1.3+S.con*1.5+S.spd*.8+S.fld*.8+S.sta*.6)/5;const o=S.keys.filter(k=>PP[k]&&k!='ff');return(S.ff*1.5+o.reduce((a,k)=>a+S[k],0)/o.length+S.ctl*1.5+S.sta*.8)/4.8}
const pro=()=>S.age>=18&&!(S.path=='uni'&&S.age<22);
const team=()=>S.age<18?'高中校隊':!pro()?'大學校隊':LV[S.lvl];
const diff=()=>S.age<18?.3:!pro()?.45:.55+.1*S.lvl;
const M={skl:()=>S.role=='B'?'con':'ctl',pow:()=>S.role=='B'?'pow':'ff',spd:()=>S.role=='B'?'spd':'sta',fld:()=>S.role=='B'?'fld':'ctl',sta:()=>'sta'};
function injure(){if(rn()<.7){S.inj=1;return '小傷(休養約一個月,今年表現打折)'}S.out=R(1,2);return `大傷(將缺席 ${S.out} 個賽季)`}
function fx(o){const t=[];for(const k in o){const v=o[k],s=v>0?'+':'';if(M[k]){const q=M[k]();S[q]=cl(S[q]+v);t.push(`${N[q]}${s}${v}`)}else if(k=='men'){S.pts+=v;t.push(`天賦點${s}${v}`)}else if(k=='fame'){S.fame=Math.max(0,S.fame+v);t.push(`名聲${s}${v}`)}else if(k=='money'){S.money+=v;t.push(`資產${s}${v}萬`)}else if(k=='inj'&&rn()<v)t.push(injure())}return t.join('、')}
function hud(){return `<div class=card><b>${S.name}</b>・${S.role=='P'?'投手':'打者('+(S.hand=='L'?'左':'右')+')'}・${S.age}歲・${team()}<br><small>名聲 ${S.fame}・資產 ${S.money}萬・天賦點 ${S.pts}${S.inj?'・🩹傷':''}${S.role=='P'?`・最速 ${vel('ff',S.ff)}km/h`:''}</small><div class=g>${S.keys.map(k=>`<div>${N[k]} ${S[k]}<i><u style="width:${S[k]}%"></u></i></div>`).join('')}</div></div>`}

function start(){show(`<div class=card><h2>⚾ 棒球人生</h2>從 15 歲高中新生打到退休。<br><br><input id=nm placeholder="你的名字" style="width:100%;box-sizing:border-box"></div><button class=p ${A(()=>hsel($('#nm').value))}>我要當打者</button><button class=p ${A(()=>newG('P'))}>我要當投手</button>`)}
function pick(nm){show(`<div class=card><h2>選擇球種</h2>四縫線速球必備,再選 3~5 種(共 4~6 種)。<br>${Object.keys(PN).filter(k=>k!='ff').map(k=>`<label style="display:inline-block;width:48%"><input type=checkbox name=pk value=${k}> ${PN[k]}</label>`).join('')}</div><button class=p ${A(()=>{const c=[...document.querySelectorAll('[name=pk]:checked')].map(e=>e.value);if(c.length<3||c.length>5)return alert('請選 3~5 種');newG('P',nm,c)})}>確定</button>`)}
function hsel(nm){nm=nm||'無名新人';show(`<div class=card><h2>選擇打擊姿勢</h2>左右打會影響你的站位。</div><button class=p ${A(()=>newG('B',nm,null,'R'))}>右打</button><button class=p ${A(()=>newG('B',nm,null,'L'))}>左打</button>`)}
function newG(r,nm,pk,hd){nm=nm||$('#nm').value;pk=pk||Object.keys(PN).filter(k=>k!='ff').sort(()=>rn()-.5).slice(0,R(3,5));S={name:(nm||'').trim()||'無名新人',role:r,hand:hd||'R',age:15,path:'',lvl:0,fame:0,money:0,inj:0,out:0,pts:40,c:{hr:0,h:0,w:0,k:0},used:[],yrs:0};S.keys=r=='B'?['pow','con','spd','fld','sta']:['ff',...pk,'ctl','sta'];const bn=R(-5,12);S.keys.forEach(k=>S[k]=c2(R(15,50)+bn,5,70));S.pts=0;S.base=ovr();show(hud()+`<div class=card><h2>你的天賦</h2>這是你與生俱來的天賦。之後每年的成長點數,取決於你比賽的表現。</div><button class=p ${A(year)}>開始高中生活</button>`)}
function alloc(done){const a={};S.keys.forEach(k=>a[k]=0);let left=S.pts;const draw=()=>{show(hud()+`<div class=card><h2>分配天賦點</h2>剩餘 <b>${left}</b> 點(上限 100;能力越高,每升 1 點花費越多)</div>`+S.keys.map(k=>`<div class=card style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="flex:1">${N[k]} ${S[k]+a[k]}${a[k]?` (+${a[k]})`:''} <small>每點 ${cost(S[k]+a[k])} 點數</small></span><button style="width:52px;text-align:center" ${A(()=>{if(a[k]>0){left+=cost(S[k]+a[k]-1);a[k]--;draw()}})}>−</button><button style="width:52px;text-align:center" ${A(()=>{const c=cost(S[k]+a[k]);if(left>=c&&S[k]+a[k]<100){left-=c;a[k]++;draw()}})}>＋</button></div>`).join('')+`<button class=p ${A(()=>{S.keys.forEach(k=>S[k]+=a[k]);S.pts=left;done()})}>完成</button>`)};draw()}

function year(){if(S.age==18&&!S.path)return draft();if(S.age==22&&S.path=='uni'){S.lvl=ovr()>60?1:0;S.money+=300}if(S.out>0)return rehab();train()}
function draft(){const sp=c2((S.base-30)/45+(ovr()-50)/250,.05,.9),go=t=>show(hud()+`<div class=card>${t}</div><button class=p ${A(year)}>繼續</button>`);
 show(hud()+`<div class=card><h2>18 歲・人生岔路</h2>高中畢業了,你要往哪走?</div>
<button ${A(()=>{S.path='pro';S.money+=200;S.fame+=ovr()>60?10:0;year()})}>參加職棒選秀:進二軍,賺錢磨練實戰</button>
<button ${A(()=>{S.path='uni';S.pts+=6;year()})}>念大學球隊:4 年成長(+6 天賦點),22 歲再進職棒</button>
<button ${A(()=>{S.path='pro';if(rn()<sp){S.lvl=1;S.fame+=15;S.money+=500;go('旅美挑戰成功!你帶著名氣回國,直接站上一軍。')}else{S.lvl=0;S.pts=Math.max(0,S.pts-3);go('旅美碰壁,灰頭土臉回到二軍。(成功率看你的天賦)')}})}>赴美挑戰(成功率約 ${Math.round(sp*100)}%)</button>`)}

function train(){const m=S.inj?1:3;show(hud()+`<div class=card><h2>${S.age}歲・訓練重點</h2>選一項,該能力免費 +${m}。${S.inj?'<small>帶傷訓練效果較低。</small>':''}</div><div class=g2>${S.keys.map(k=>`<button ${A(()=>{const g=Math.max(1,Math.round(m*(S[k]>=85?.34:S[k]>=70?.5:1)));S[k]=cl(S[k]+g);ev(`${N[k]}+${g}`)})}>${N[k]}</button>`).join('')}<button ${A(()=>{S.inj=0;ev('傷勢痊癒、天賦點+2'+(S.pts+=2,''))})}>休息療養</button></div>`)}

const EV=[
['學長邀你晚上加練',[['答應',{sta:2,skl:2,inj:.25},'進步了,但身體吃不消。'],['婉拒',{men:2},'你相信自己的節奏。']]],
['球探來看你的比賽',[['放膽表現',{men:2,fame:6,inj:.1},'敢衝的樣子被記下來了。'],['低調不理會',{skl:2},'專心練自己的東西。']]],
['好友邀你翹掉練習',[['去玩',{men:3,skl:-1},'放鬆了,手感有點生。'],['繼續練',{skl:2},'孤單但踏實。']]],
['教練要你大幅調整動作',[['全盤接受',{skl:4,pow:-1,inj:.15},'短期不適,長期看好。'],['堅持原本的',{men:2,fame:1},'你捍衛了自己的風格。']]],
['媒體想專訪你',[['接受',{fame:7,men:-1},'曝光增加,壓力也來了。'],['婉拒',{men:2},'注意力留在球場。']]],
['家人生病,需要你回去照顧',[['回家陪伴',{men:3,sta:-2,skl:-2},'失去訓練時間,得到更重要的。'],['留下拚前途',{skl:3,fame:2,men:-3},'你選擇棒球,心裡有愧疚。']]],
['隊友重傷,你被推上先發',[['接下重任',{men:3,fame:4,inj:.2},'你撐住了。'],['讓資深的上',{men:1,fld:1},'你穩穩等機會。']]],
['廠商邀你代言',[['接下',{money:300,fame:5,skl:-2},'名利到手,練習被擠壓。'],['拒絕',{skl:2,men:1},'守住專注。']],1],
['新人挑戰你的位置',[['正面較量',{skl:2,men:-1,inj:.1},'你被逼出新的進步。'],['當他的前輩',{men:3,fame:2},'你贏得了尊重。']]],
['季前集訓可去高海拔',[['去',{sta:3,inj:.12},'呼吸很辛苦,體能卻上去了。'],['留在原地',{skl:1,men:1},'穩穩地練。']]],
['網路上有人狂酸你',[['公開回嗆',{fame:3,men:-2},'話題度有了,心也亂了。'],['關掉不看',{men:2},'你把雜音關在外面。']]],
['受邀參加國家隊選拔',[['全力爭取',{fame:8,sta:-2,inj:.15},'賽事很硬,你學到很多。'],['婉拒養傷',{sta:2,men:1},'你把身體放第一。']],1],
['冬季聯盟有海外出賽機會',[['出國磨練',{skl:3,sta:-1,money:-50},'見識到不同的野球。'],['待在家鄉',{men:2,fame:1},'你好好休息。']],1],
['教練問你要不要嘗試新定位',[['接受挑戰',{fld:2,skl:1,fame:2,inj:.1},'你拓展了可能性。'],['維持現狀',{men:1},'你專注本業。']]],
['你連續幾場表現不佳,陷入低潮',[['找人聊聊調整',{men:3},'你走出了低潮。'],['加倍苦練',{skl:2,sta:-2,inj:.2},'練得太狠,身體有些吃不消。']]],
['營養師建議調整飲食與睡眠',[['認真照做',{sta:3,spd:1},'身體狀況明顯變好。'],['照舊',{men:1},'你覺得沒必要。']]],
['球迷在街上認出你',[['停下來簽名合照',{fame:4,men:1},'球迷很開心。'],['趕時間先走',{fame:-1},'有點失禮。']]],
['球團要跟你談新合約',[['要求加薪',{money:400,fame:-1},'談判成功,但氣氛有點僵。'],['簽長約求穩',{money:150,men:2},'你得到安心感。']],1],
['有人私下找你「喬」比賽',[['嚴詞拒絕並通報',{men:3,fame:6},'你守住底線。'],['敷衍帶過',{men:-3,fame:-4,money:100},'心裡一直不踏實。']],1]];
function ev(pre){if(S.role=='P'&&S.keys.filter(k=>PP[k]).length<6&&rn()<.06){const c=Object.keys(PN).filter(k=>!S.keys.includes(k)),k=c[R(0,c.length-1)],nx=t=>show(hud()+`<div class=card>${t}</div><button class=p ${A(game)}>年度比賽</button>`);return show(hud()+`<div class=card><small>訓練:${pre}</small><h2>難得的機會</h2>一位前輩願意教你「${PN[k]}」。新球種起始只有 20,要再花天賦點磨練。</div><button ${A(()=>{S.keys.splice(S.keys.indexOf('ctl'),0,k);S[k]=20;nx('你學會了'+PN[k]+'(起始 20)。')})}>跟他學</button><button ${A(()=>nx('你婉拒了,專心練現有的球種。'))}>婉拒</button>`)}const pool=EV.map((e,i)=>i).filter(i=>!S.used.includes(i)&&(!EV[i][2]||pro()));const i=pool.length?pool[R(0,pool.length-1)]:R(0,6);S.used.push(i);const e=EV[i];
 show(hud()+`<div class=card><small>訓練:${pre}</small><h2>事件</h2>${e[0]}</div>`+e[1].map(o=>`<button ${A(()=>{const t=fx(o[1]);show(hud()+`<div class=card>${o[2]}<br><small>${t}</small></div><button class=p ${A(S.out>0?rehab:game)}>${S.out>0?'接受治療':'年度比賽'}</button>`)})}>${o[0]}</button>`).join(''))}
function rehab(){S.out--;S.age++;S.yrs++;S.fame=Math.max(0,S.fame-3);ageP();if(pro())S.lvl=Math.max(0,S.lvl-1);let t='你整年都在復健,沒能上場。';if(S.out==0){S.inj=0;t+=' '+fx({sta:-R(1,3),spd:-R(0,2)})}
 show(hud()+`<div class=card><h2>傷停</h2>${t}${S.out?`<br>還需 ${S.out} 個賽季。`:'<br>你準備好回歸了。'}</div><button class=p ${A(nxt)}>繼續</button>`)}
function ageP(){if(S.age>=30)S.keys.forEach(k=>{S[k]=cl(S[k]-R(0,k=='sta'||k=='spd'||k=='ff'||k=='pow'?2:1)-(S.age>35?1:0))})}
function nxt(){if(S.age>=40||(S.age>25&&ovr()<36))return show(hud()+`<div class=card>歲月與身體都在提醒你:是時候了。</div><button class=p ${A(end)}>宣布退休</button>`);alloc(year)}

function game(){show(hud()+`<div class=card><h2>年度關鍵比賽</h2>${S.role=='P'?'先選球種,再點擊好球帶指定球的最終位置;控球差或疲勞時,球路可能偏軟、容易被打。先發投到被換下,後援投 1~2 局。':'投手會做出投球動作,球飛來時,到好球帶(打者胸口到膝蓋)的時機點擊揮棒;壞球忍住。越後面變化球越多。'}<small><br>對手強度 ${Math.round(diff()*100)}</small></div><button class=p ${A(()=>S.role=='P'?pit():bat())}>親自上場</button><button ${A(sim)}>快速模擬本場</button>`)}
let G;const newG2=()=>G={inn:1,my:0,op:0,st:null},ST=()=>({b:[0,0,0],o:0,r:0});
function adv(s,n){const nb=[0,0,0];for(let i=2;i>=0;i--)if(s.b[i]){if(i+n>=3)s.r++;else nb[i+n]=1}if(n==4)s.r++;else nb[n-1]=1;s.b=nb}
function wk(s){const b=s.b;if(b[0]){if(b[1]){if(b[2])s.r++;b[2]=1}b[1]=1}b[0]=1}
function out(s,k){s.o++;if(k||s.o>=3)return;if(s.b[0]&&rn()<.2){s.b[0]=0;s.o++;return}if(s.b[2]&&rn()<.25){s.b[2]=0;s.r++}}
function apply(s,c){if('124'.includes(c))adv(s,+c);else if(c=='W')wk(s);else out(s,c=='K')}
function apc(p){const r=rn();if(r<.08)return 'W';if(r<.08+p){const s=rn();return s<.68?'1':s<.92?'2':'4'}return rn()<.2?'K':'O'}
function half(s,p){while(s.o<3)apply(s,apc(p));return s.r}
const bs=s=>s?s.b.map((x,i)=>x?i+1:'').join('')||'無':'無';
